plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id "com.diffplug.spotless" version "${spotless_version}"
}

repositories {
    maven { url "https://maven.shedaniel.me/" }
    maven { url "https://maven.terraformersmc.com/releases/" }
}

dependencies {
    // To change the versions see the gradle.properties file
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"

    // Fabric API
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

    // Cloth Config
    api("me.shedaniel.cloth:cloth-config-fabric:${project.cloth_version}") {
        exclude(group: "net.fabricmc.fabric-api")
    }

    // ModMenu
    api "com.terraformersmc:modmenu:${project.modmenu_version}"

    // Testing
    testImplementation "net.fabricmc:fabric-loader-junit:${project.loader_version}"
}

base {
    archivesName = project.archives_base_name
}
version = project.mod_version
group = project.maven_group
def fabric_api_version = project.fabric_api_version.tokenize('+')[0]

tasks.withType(JavaCompile).configureEach {
    it.options.encoding = "UTF-8"
}

test {
    useJUnitPlatform()
    systemProperty "fabric.side", "client"
    testLogging {
        events "passed", "failed", "skipped", "standardOut", "standardError"
    }
}

java {
    toolchain {
        languageVersion.set(JavaLanguageVersion.of(java_version))
    }
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.base.archivesName.get()}" }
    }
}

processResources {
    inputs.properties([
        "cloth_version": project.cloth_version,
        "fabric_api_version": fabric_api_version,
        "loader_version": project.loader_version,
        "mod_version": project.mod_version,
        "modmenu_version": project.modmenu_version,
        "supported_minecraft_versions": project.supported_minecraft_versions,
    ])

    filesMatching("fabric.mod.json") {
        expand([
            cloth_version: project.cloth_version,
            fabric_api_version: fabric_api_version,
            loader_version: project.loader_version,
            mod_version: project.mod_version,
            modmenu_version: project.modmenu_version,
            supported_minecraft_versions: project.supported_minecraft_versions,
        ])
    }
}

spotless {
    java {
        // define the steps to apply to Java source code
        importOrder()
        removeUnusedImports()
        palantirJavaFormat(spotless_palantir_version)
        trimTrailingWhitespace()
        endWithNewline()
        // Custom rule from https://github.com/apache/geode
        custom "Refuse wildcard imports", {
            if (it =~ /\nimport .*\*;/) {
                throw new AssertionError("Do not use wildcard imports. 'spotlessApply' cannot resolve this issue.")
            }
        }
        custom "Refuse IntelliJ annotations", {
            if (it =~ /\nimport org\.jetbrains\.annotations\./) {
                throw new AssertionError("Do not use IntelliJ annotations. 'spotlessApply' cannot resolve this issue.")
            }
        }
        custom "No empty line after opening curly brace", {
            it.replaceAll(/\{\n\n/, '{\n')
        }
        licenseHeader("/*\n" +
                " * Copyright © Magnus Ihse Bursie \$YEAR.\n" +
                " * This file is released under MIT. See LICENSE for full license details.\n" +
                " */")
                .updateYearWithLatest(true)
    }
    json {
        target "**/*.json"
        // schemaVersion must be at the top or else Fabric will complain
        targetExclude("src/main/resources/fabric.mod.json", 'run/**')
        gson()
                .indentWithSpaces(2)
                .sortByKeys()
                .version(spotless_gson_version)
        trimTrailingWhitespace()
        endWithNewline()
    }
    groovyGradle {
        target '**/*.gradle'
        greclipse("${spotless_greclipse_version}").configFile("${rootDir}/greclipse.properties")
        trimTrailingWhitespace()
        endWithNewline()
    }
    format "misc", {
        target "*.md", ".gitignore", "*.properties"

        trimTrailingWhitespace()
        leadingTabsToSpaces()
        endWithNewline()
    }
}
